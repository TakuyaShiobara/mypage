<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | たきやのIT部屋</title>
<meta name="description" content="たきやのIT部屋へのお問い合わせフォームです。">
<link rel="canonical" href="/contact.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Contact | たきやのIT部屋">
<meta property="og:description" content="たきやのIT部屋へのお問い合わせフォームです。">
<meta property="og:image" content="/assets/images/hero-placeholder.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
<div id="site-header"></div>

<main id="main">
  <section class="page-section container">
    <div class="page-heading">
      <h1>Contact</h1>
      <p>お仕事のご相談・ご質問などお気軽にお問い合わせください。</p>
    </div>

    <div class="contact-layout">
      <div id="form-status" role="status"></div>

      <form id="contact-form" novalidate>
        <div class="field" id="field-name">
          <label for="name">名前 <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <p class="error"></p>
        </div>

        <div class="field" id="field-email">
          <label for="email">メールアドレス <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="error"></p>
        </div>

        <div class="field" id="field-subject">
          <label for="subject">件名 <span aria-hidden="true">*</span></label>
          <input type="text" id="subject" name="subject" required>
          <p class="error"></p>
        </div>

        <div class="field" id="field-message">
          <label for="message">お問い合わせ内容 <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="6" required></textarea>
          <p class="error"></p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">送信する</button>
        </div>
      </form>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
